<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 810" width="1080" height="810" style="background:#ffffff; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="stanfordRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1515"/>
      <stop offset="100%" stop-color="#5C0D0D"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <pattern id="certPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#f1ece6" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Background with subtle watermark lattice -->
  <rect width="1080" height="810" fill="#fcfbf9"/>
  <rect width="1080" height="810" fill="url(#certPattern)"/>

  <!-- Ornate Outer & Inner Borders -->
  <rect x="24" y="24" width="1032" height="762" fill="none" stroke="#8C1515" stroke-width="4"/>
  <rect x="34" y="34" width="1012" height="742" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <rect x="40" y="40" width="1000" height="730" fill="none" stroke="#8C1515" stroke-width="0.8" stroke-dasharray="6,3"/>

  <!-- Top Header Banner -->
  <g transform="translate(70, 75)">
    <!-- Stanford Seal Graphic -->
    <circle cx="45" cy="45" r="42" fill="url(#stanfordRed)"/>
    <circle cx="45" cy="45" r="38" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="45" y="38" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1">STANFORD</text>
    <path d="M35 48 Q45 32 55 48 Q45 64 35 48 Z" fill="#ffffff"/>
    <text x="45" y="66" text-anchor="middle" fill="#ffffff" font-size="9" letter-spacing="2">1891</text>

    <!-- Header Text -->
    <text x="110" y="36" fill="#8C1515" font-size="28" font-weight="800" letter-spacing="3">STANFORD ONLINE</text>
    <text x="110" y="60" fill="#555555" font-size="14" font-weight="600" letter-spacing="1.5">IN COLLABORATION WITH DEEPLEARNING.AI</text>

    <!-- DeepLearning.AI logo badge -->
    <g transform="translate(720, 15)">
      <rect width="180" height="50" rx="8" fill="#f4f4f6" stroke="#e0e0e4"/>
      <circle cx="28" cy="25" r="10" fill="#FF5E3A"/>
      <circle cx="28" cy="25" r="5" fill="#ffffff"/>
      <text x="48" y="31" fill="#1f1f2e" font-size="14" font-weight="700" letter-spacing="0.5">DeepLearning.AI</text>
    </g>
  </g>

  <!-- Divider Ribbon -->
  <line x1="70" y1="180" x2="1010" y2="180" stroke="#8C1515" stroke-width="2"/>
  <line x1="70" y1="185" x2="1010" y2="185" stroke="#d4af37" stroke-width="1"/>

  <!-- Certificate Body -->
  <g transform="translate(540, 240)" text-anchor="middle">
    <text y="0" fill="#777777" font-size="14" font-weight="600" letter-spacing="4">SPECIALIZATION CERTIFICATE OF COMPLETION</text>
    <text y="30" fill="#555555" font-size="15">This is to certify that</text>
    
    <!-- Recipient Name -->
    <text y="80" fill="#0f172a" font-size="38" font-weight="800" letter-spacing="1" font-family="'Newsreader', Georgia, serif">Muhammad Hassaan Bin Saqib</text>
    <line x1="-220" y1="98" x2="220" y2="98" stroke="#8C1515" stroke-width="1.5"/>

    <text y="130" fill="#555555" font-size="15">has successfully completed all requirements for the 3-course curriculum</text>
    
    <!-- Course Title -->
    <text y="175" fill="#8C1515" font-size="32" font-weight="800" letter-spacing="1">Machine Learning Specialization</text>

    <text y="215" fill="#475569" font-size="13.5" font-weight="500">
      Supervised Machine Learning &middot; Advanced Learning Algorithms &middot; Unsupervised Learning &amp; Recommenders
    </text>
  </g>

  <!-- Gold Seal Emblem -->
  <g transform="translate(180, 610)">
    <circle cx="45" cy="45" r="44" fill="url(#goldSeal)"/>
    <circle cx="45" cy="45" r="39" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="45" y="38" text-anchor="middle" fill="#2d1c02" font-size="9" font-weight="800" letter-spacing="1">VERIFIED</text>
    <text x="45" y="52" text-anchor="middle" fill="#2d1c02" font-size="13" font-weight="800">★ ★ ★</text>
    <text x="45" y="64" text-anchor="middle" fill="#2d1c02" font-size="8.5" font-weight="700" letter-spacing="1">COURSERA</text>
  </g>

  <!-- Signatures and Details -->
  <g transform="translate(540, 610)">
    <g transform="translate(160, 0)">
      <!-- Andrew Ng Signature Line -->
      <path d="M-60 25 Q-20 -5 10 20 Q40 45 80 15 Q100 5 130 25" fill="none" stroke="#1e293b" stroke-width="2.5"/>
      <line x1="-80" y1="45" x2="160" y2="45" stroke="#94a3b8" stroke-width="1"/>
      <text x="40" y="62" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Andrew Ng</text>
      <text x="40" y="77" text-anchor="middle" fill="#64748b" font-size="11">Founder, DeepLearning.AI &middot; Adjunct Professor, Stanford</text>
    </g>
  </g>

  <!-- Issue Date and Verification Details -->
  <g transform="translate(70, 740)">
    <text fill="#64748b" font-size="11.5" font-weight="500">Issued: June, MMXXV (2025) &middot; National University of Computer &amp; Emerging Sciences</text>
    <text x="940" y="0" text-anchor="end" fill="#64748b" font-size="11" font-weight="500">Verify at coursera.org/verify/specialization</text>
  </g>
</svg>
